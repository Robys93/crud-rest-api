<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="inherit" markerWidth="16" markerHeight="16" refX="14" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L14,6 L1,11 Z" fill="#ffffff" stroke="#475569" stroke-width="1.3"/>
    </marker>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L10,5 L1,9 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="660" fill="#ffffff"/>
  <text x="460" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Architettura del layer generico CRUD</text>
  <text x="460" y="60" text-anchor="middle" font-size="13" fill="#64748b">La logica CRUD vive una sola volta nel layer generico; User e Product la riusano per ereditarietà</text>

  <!-- Column headers -->
  <text x="180" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#10b981">Modulo User</text>
  <text x="460" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#6366f1">Layer generico (common)</text>
  <text x="740" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#f59e0b">Modulo Product</text>

  <!-- Swimlane labels -->
  <text x="20" y="165" font-size="12" font-weight="600" fill="#94a3b8" transform="rotate(-90 20 165)" text-anchor="middle">CONTROLLER</text>
  <text x="20" y="310" font-size="12" font-weight="600" fill="#94a3b8" transform="rotate(-90 20 310)" text-anchor="middle">SERVICE</text>
  <text x="20" y="500" font-size="12" font-weight="600" fill="#94a3b8" transform="rotate(-90 20 500)" text-anchor="middle">PERSISTENZA / MAPPING</text>

  <!-- ===== CONTROLLER LANE ===== -->
  <!-- UserController -->
  <rect x="80" y="125" width="200" height="62" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="180" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">UserController</text>
  <text x="180" y="170" text-anchor="middle" font-size="11" fill="#047857">@RestController</text>
  <text x="180" y="182" text-anchor="middle" font-size="11" fill="#047857">@RequestMapping("/users")</text>

  <!-- GenericController -->
  <rect x="360" y="120" width="200" height="72" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="460" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">GenericController</text>
  <text x="460" y="163" text-anchor="middle" font-size="11" font-style="italic" fill="#4f46e5">&lt;T, DTO, ID&gt; (abstract)</text>
  <text x="460" y="181" text-anchor="middle" font-size="10" fill="#6366f1">POST · GET · GET/{id} · PUT · DELETE</text>

  <!-- ProductController -->
  <rect x="640" y="125" width="200" height="62" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="740" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">ProductController</text>
  <text x="740" y="170" text-anchor="middle" font-size="11" fill="#b45309">@RestController</text>
  <text x="740" y="182" text-anchor="middle" font-size="11" fill="#b45309">@RequestMapping("/products")</text>

  <!-- ===== SERVICE LANE ===== -->
  <!-- UserService -->
  <rect x="80" y="280" width="200" height="60" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="180" y="305" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">UserService</text>
  <text x="180" y="325" text-anchor="middle" font-size="11" fill="#047857">@Service</text>

  <!-- GenericService -->
  <rect x="360" y="270" width="200" height="80" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="460" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">GenericService</text>
  <text x="460" y="313" text-anchor="middle" font-size="11" font-style="italic" fill="#4f46e5">&lt;T extends BaseEntity,</text>
  <text x="460" y="327" text-anchor="middle" font-size="11" font-style="italic" fill="#4f46e5">DTO, ID&gt; (abstract)</text>
  <text x="460" y="343" text-anchor="middle" font-size="10" fill="#6366f1">create · findAll · findById · update · delete</text>

  <!-- ProductService -->
  <rect x="640" y="280" width="200" height="60" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="740" y="305" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">ProductService</text>
  <text x="740" y="325" text-anchor="middle" font-size="11" fill="#b45309">@Service</text>

  <!-- ===== PERSISTENCE / MAPPING LANE ===== -->
  <!-- GenericRepository interface -->
  <rect x="360" y="430" width="200" height="58" rx="8" fill="#f8fafc" stroke="#6366f1" stroke-width="1.6" stroke-dasharray="0"/>
  <text x="460" y="453" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">&#171;interface&#187;</text>
  <text x="460" y="471" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">GenericRepository&lt;T, ID&gt;</text>

  <!-- InMemoryRepository -->
  <rect x="360" y="540" width="200" height="72" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text x="460" y="565" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">InMemoryRepository</text>
  <text x="460" y="582" text-anchor="middle" font-size="11" font-style="italic" fill="#4f46e5">&lt;T extends BaseEntity&gt;</text>
  <text x="460" y="600" text-anchor="middle" font-size="10" fill="#6366f1">ConcurrentHashMap · AtomicLong</text>

  <!-- GenericMapper interface -->
  <rect x="640" y="430" width="200" height="58" rx="8" fill="#f8fafc" stroke="#6366f1" stroke-width="1.6"/>
  <text x="740" y="453" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">&#171;interface&#187;</text>
  <text x="740" y="471" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">GenericMapper&lt;T, DTO&gt;</text>

  <!-- UserRepository / ProductRepository concrete -->
  <rect x="80" y="535" width="200" height="40" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
  <text x="180" y="560" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">UserRepository @Repository</text>
  <rect x="80" y="583" width="200" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="180" y="608" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">ProductRepository @Repository</text>

  <!-- BaseEntity -->
  <rect x="640" y="540" width="200" height="48" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="740" y="563" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">BaseEntity (abstract)</text>
  <text x="740" y="579" text-anchor="middle" font-size="10" fill="#6366f1">Long id</text>

  <!-- ===== INHERITANCE ARROWS (open triangle, dashed) ===== -->
  <!-- UserController -> GenericController -->
  <path d="M280,156 L352,156" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#inherit)"/>
  <!-- ProductController -> GenericController -->
  <path d="M640,156 L568,156" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#inherit)"/>
  <!-- UserService -> GenericService -->
  <path d="M280,310 L352,310" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#inherit)"/>
  <!-- ProductService -> GenericService -->
  <path d="M640,310 L568,310" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#inherit)"/>
  <!-- InMemoryRepository implements GenericRepository -->
  <path d="M460,540 L460,496" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#inherit)"/>
  <!-- User/Product Repository extend InMemoryRepository -->
  <path d="M280,555 L352,565" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#inherit)"/>
  <path d="M280,603 L352,585" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#inherit)"/>

  <!-- ===== COMPOSITION / DEPENDENCY ARROWS (solid) ===== -->
  <!-- GenericController -> GenericService (service) -->
  <path d="M460,192 L460,266" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="470" y="232" font-size="10" fill="#475569">service</text>
  <!-- GenericService -> GenericRepository (repository) -->
  <path d="M440,350 L440,426" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="385" y="392" font-size="10" fill="#475569">repository</text>
  <!-- GenericService -> GenericMapper (mapper) -->
  <path d="M540,335 C620,360 700,390 740,426" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="660" y="372" font-size="10" fill="#475569">mapper</text>

  <!-- legend -->
  <rect x="80" y="635" width="14" height="12" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="100" y="645" font-size="10" fill="#64748b">eredita / implementa</text>
  <line x1="240" y1="641" x2="262" y2="641" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="268" y="645" font-size="10" fill="#64748b">dipende da (composizione)</text>

  <text x="740" y="612" text-anchor="middle" font-size="10" fill="#92400e">UserMapper / ProductMapper implementano GenericMapper</text>
</svg>
